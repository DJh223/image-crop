<!DOCTYPE html>
<html lang="zh-CN" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Crop to 16:9</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = {
  darkMode: 'class',
  theme: {
    extend: {
      fontFamily: { sans: ['Inter', 'system-ui', '-apple-system', 'sans-serif'] },
      colors: {
        surface: { DEFAULT: '#0f0f0f', 2: '#1a1a1a', 3: '#242424' },
        border: { DEFAULT: '#2a2a2a', accent: '#3a3a3a' },
      }
    }
  }
}
</script>
<style>
  .drag-over { border-color: #60a5fa !important; background: rgba(96,165,250,0.06) !important; }
  .crop-overlay { position: absolute; pointer-events: none; }
  .crop-overlay::after {
    content: ''; position: absolute; inset: 0;
    box-shadow: 0 0 0 9999px rgba(0,0,0,0.55);
    border: 2px solid rgba(255,255,255,0.9);
  }
</style>
</head>
<body class="bg-surface text-white min-h-screen font-sans">

<header class="border-b border-border px-6 py-4 flex items-center justify-between">
  <div class="flex items-center gap-3">
    <svg class="w-6 h-6 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <rect x="3" y="3" width="18" height="18" rx="2" stroke-width="1.5"/>
      <rect x="4" y="5" width="16" height="9" rx="1" stroke-width="1.2" stroke="white" opacity="0.6"/>
    </svg>
    <h1 class="text-lg font-semibold tracking-tight">Crop to <span class="text-blue-400">16:9</span></h1>
  </div>
  <button onclick="toggleDark()" class="p-2 rounded-lg hover:bg-surface-3 transition-colors" title="Toggle dark mode">
    <svg id="sun" class="w-5 h-5 hidden" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
    </svg>
    <svg id="moon" class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
      <path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/>
    </svg>
  </button>
</header>

<main class="max-w-4xl mx-auto px-4 py-8 space-y-6">

  <!-- Upload -->
  <div id="dropZone"
       class="border-2 border-dashed border-border-accent rounded-2xl p-12 text-center cursor-pointer
              hover:border-blue-500/60 hover:bg-blue-500/5 transition-all"
       onclick="document.getElementById('fileInput').click()">
    <input type="file" id="fileInput" accept="image/*" class="hidden" onchange="handleFile(this.files[0])">
    <svg class="w-10 h-10 mx-auto mb-4 text-zinc-600" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
      <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M17 8l-5-5-5 5M12 3v12"/>
    </svg>
    <p class="text-zinc-400 text-sm">Drop an image here, or <span class="text-blue-400">click to browse</span></p>
    <p class="text-zinc-600 text-xs mt-2">PNG, JPG, WebP — any size</p>
  </div>

  <!-- Main content -->
  <div id="workspace" class="hidden space-y-6">

    <!-- Previews -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
      <!-- Original -->
      <div class="rounded-xl border border-border overflow-hidden bg-surface-2">
        <div class="px-4 py-2.5 border-b border-border flex items-center justify-between">
          <span class="text-xs font-medium text-zinc-400">Original</span>
          <span id="origSize" class="text-xs text-zinc-600"></span>
        </div>
        <div id="origContainer" class="relative flex items-center justify-center bg-[#0a0a0a] p-4" style="min-height:300px">
          <img id="origImg" class="max-h-[400px] max-w-full object-contain" alt="Original">
          <div id="cropOverlay" class="crop-overlay hidden"></div>
        </div>
      </div>

      <!-- Preview -->
      <div class="rounded-xl border border-border overflow-hidden bg-surface-2">
        <div class="px-4 py-2.5 border-b border-border flex items-center justify-between">
          <span class="text-xs font-medium text-zinc-400">Preview (16:9)</span>
          <span id="previewSize" class="text-xs text-zinc-600"></span>
        </div>
        <div class="flex items-center justify-center bg-[#0a0a0a] p-4" style="min-height:300px">
          <canvas id="previewCanvas" class="max-h-[400px] max-w-full rounded-lg shadow-lg"></canvas>
        </div>
      </div>
    </div>

    <!-- Controls -->
    <div class="flex flex-wrap items-center justify-between gap-4">
      <div class="flex items-center gap-1.5 bg-surface-2 rounded-lg p-1 border border-border">
        <button onclick="setPosition('center')" data-pos="center"
                class="px-4 py-2 text-sm rounded-md font-medium transition-all bg-surface-3 text-white">Center</button>
        <button onclick="setPosition('top')" data-pos="top"
                class="px-4 py-2 text-sm rounded-md font-medium transition-all text-zinc-400 hover:text-white hover:bg-surface-3">Top</button>
        <button onclick="setPosition('bottom')" data-pos="bottom"
                class="px-4 py-2 text-sm rounded-md font-medium transition-all text-zinc-400 hover:text-white hover:bg-surface-3">Bottom</button>
        <button onclick="setPosition('left')" data-pos="left"
                class="px-4 py-2 text-sm rounded-md font-medium transition-all text-zinc-400 hover:text-white hover:bg-surface-3">Left</button>
        <button onclick="setPosition('right')" data-pos="right"
                class="px-4 py-2 text-sm rounded-md font-medium transition-all text-zinc-400 hover:text-white hover:bg-surface-3">Right</button>
      </div>

      <button onclick="download()"
              class="px-6 py-2.5 bg-blue-600 hover:bg-blue-500 rounded-lg text-sm font-medium
                     transition-all inline-flex items-center gap-2 shadow-lg shadow-blue-600/20">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M7 10l5 5 5-5M12 15V3"/>
        </svg>
        Download
      </button>
    </div>
  </div>
</main>

<script>
let currentImage = null;
let currentFormat = 'image/jpeg';
let position = 'center';

const DROP = document.getElementById('dropZone');
const WS = document.getElementById('workspace');
const ORIG_IMG = document.getElementById('origImg');
const OVERLAY = document.getElementById('cropOverlay');
const ORIG_CONTAINER = document.getElementById('origContainer');
const CANVAS = document.getElementById('previewCanvas');

// Drag & drop
DROP.addEventListener('dragover', e => { e.preventDefault(); DROP.classList.add('drag-over'); });
DROP.addEventListener('dragleave', () => DROP.classList.remove('drag-over'));
DROP.addEventListener('drop', e => {
  e.preventDefault(); DROP.classList.remove('drag-over');
  const file = e.dataTransfer.files[0];
  if (file) handleFile(file);
});

function handleFile(file) {
  if (!file || !file.type.startsWith('image/')) return;
  currentFormat = file.type;
  const reader = new FileReader();
  reader.onload = () => {
    const img = new Image();
    img.onload = () => { currentImage = img; render(); };
    img.src = reader.result;
  };
  reader.readAsDataURL(file);
}

function setPosition(pos) {
  position = pos;
  document.querySelectorAll('[data-pos]').forEach(b => {
    if (b.dataset.pos === pos) b.className = 'px-4 py-2 text-sm rounded-md font-medium transition-all bg-surface-3 text-white';
    else b.className = 'px-4 py-2 text-sm rounded-md font-medium transition-all text-zinc-400 hover:text-white hover:bg-surface-3';
  });
  render();
}

function getCropRect(imgW, imgH) {
  const target = 16 / 9;
  const current = imgW / imgH;
  let x, y, w, h;

  if (current > target) {
    h = imgH; w = h * target;
    if (position === 'left') x = 0;
    else if (position === 'right') x = imgW - w;
    else x = (imgW - w) / 2;
    y = 0;
  } else {
    w = imgW; h = w / target;
    if (position === 'top') y = 0;
    else if (position === 'bottom') y = imgH - h;
    else y = (imgH - h) / 2;
    x = 0;
  }
  return { x, y, w, h };
}

function render() {
  if (!currentImage) return;
  const imgW = currentImage.naturalWidth;
  const imgH = currentImage.naturalHeight;

  DROP.classList.add('hidden');
  WS.classList.remove('hidden');

  ORIG_IMG.src = currentImage.src;
  document.getElementById('origSize').textContent = `${imgW} × ${imgH}`;

  // Update overlay on original image
  ORIG_IMG.onload = () => {
    const displayW = ORIG_IMG.offsetWidth;
    const displayH = ORIG_IMG.offsetHeight;
    const scaleX = displayW / imgW;
    const scaleY = displayH / imgH;

    const rect = getCropRect(imgW, imgH);
    OVERLAY.style.left = rect.x * scaleX + 'px';
    OVERLAY.style.top = rect.y * scaleY + 'px';
    OVERLAY.style.width = rect.w * scaleX + 'px';
    OVERLAY.style.height = rect.h * scaleY + 'px';
    OVERLAY.classList.remove('hidden');

    // Canvas preview
    const previewW = Math.min(rect.w, 640);
    const ratio = previewW / rect.w;
    CANVAS.width = previewW;
    CANVAS.height = rect.h * ratio;
    const ctx = CANVAS.getContext('2d');
    ctx.drawImage(currentImage, rect.x, rect.y, rect.w, rect.h, 0, 0, CANVAS.width, CANVAS.height);
    document.getElementById('previewSize').textContent = `${CANVAS.width} × ${CANVAS.height}`;
  };
}

function download() {
  if (!currentImage) return;
  const rect = getCropRect(currentImage.naturalWidth, currentImage.naturalHeight);
  const c = document.createElement('canvas');
  c.width = rect.w;
  c.height = rect.h;
  c.getContext('2d').drawImage(currentImage, rect.x, rect.y, rect.w, rect.h, 0, 0, c.width, c.height);

  const ext = currentFormat === 'image/png' ? 'png' : currentFormat === 'image/webp' ? 'webp' : 'jpg';
  c.toBlob(blob => {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = `cropped_16_9.${ext}`;
    a.click();
    URL.revokeObjectURL(url);
  }, currentFormat, 0.95);
}

function toggleDark() {
  const html = document.documentElement;
  html.classList.toggle('dark');
  document.getElementById('sun').classList.toggle('hidden');
  document.getElementById('moon').classList.toggle('hidden');
  if (html.classList.contains('dark')) {
    document.body.className = 'bg-surface text-white min-h-screen font-sans';
  } else {
    document.body.className = 'bg-white text-zinc-900 min-h-screen font-sans';
    DROP.classList.remove('drag-over');
  }
  // Rebuild drag-over color for light mode
  DROP.addEventListener('dragover', function lightFix(e) {
    e.preventDefault();
    if (!document.documentElement.classList.contains('dark')) {
      DROP.style.borderColor = '#2563eb';
      DROP.style.background = 'rgba(37,99,235,0.04)';
    }
  });
}
</script>
</body>
</html>
